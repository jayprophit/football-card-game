<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <!-- Card Base -->
  <rect width="300" height="420" rx="15" fill="#ffffff" />
  
  <!-- Main Color Area (will be replaced by team color) -->
  <rect x="10" y="10" width="280" height="400" rx="10" fill="#4caf50" />
  
  <!-- Inner Card Content Area -->
  <rect x="20" y="20" width="260" height="380" rx="5" fill="#ffffff" opacity="0.9" />
  
  <!-- Photo Placeholder -->
  <circle cx="150" cy="140" r="100" fill="#eeeeee" />
  <path d="M120,100 L180,100 L170,160 L130,160 Z" fill="#cccccc" />
  <circle cx="150" cy="85" r="25" fill="#cccccc" />
  
  <!-- Position Banner -->
  <rect x="50" y="250" width="200" height="40" rx="5" fill="#4caf50" />
  
  <!-- Name Banner -->
  <rect x="30" y="300" width="240" height="30" rx="5" fill="#eeeeee" />
  
  <!-- Stats Area -->
  <rect x="30" y="340" width="240" height="50" rx="5" fill="#f5f5f5" />
  
  <!-- Status Indicators Area -->
  <g transform="translate(20, 20)">
    <!-- Red Card Placeholder -->
    <rect x="0" y="0" width="20" height="30" rx="2" fill="#f5f5f5" />
    
    <!-- Yellow Card Placeholder -->
    <rect x="25" y="0" width="20" height="30" rx="2" fill="#f5f5f5" />
    
    <!-- Injury Indicator Placeholder -->
    <circle cx="60" cy="15" r="10" fill="#f5f5f5" />
  </g>
  
  <!-- Team Badge Placeholder -->
  <circle cx="260" cy="40" r="20" fill="#eeeeee" />
  
  <!-- Decorative Elements -->
  <g fill="#4caf50" opacity="0.1">
    <circle cx="50" cy="80" r="40" />
    <circle cx="250" cy="180" r="30" />
    <circle cx="80" cy="350" r="25" />
    <circle cx="220" cy="270" r="20" />
  </g>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000000" stroke-width="0.5" opacity="0.05" />
  </pattern>
  <rect width="300" height="420" fill="url(#grid)" opacity="0.3" />
</svg>
