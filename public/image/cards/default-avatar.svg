<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="#eeeeee" />
  
  <!-- Silhouette -->
  <g fill="#888888">
    <!-- Head -->
    <circle cx="100" cy="70" r="40" />
    
    <!-- Body -->
    <path d="M60,120 L140,120 L130,200 L70,200 Z" />
    
    <!-- Arms -->
    <path d="M60,120 L40,160 L30,155 L55,110 Z" />
    <path d="M140,120 L160,160 L170,155 L145,110 Z" />
  </g>
  
  <!-- Jersey (to be colored with team color) -->
  <path d="M70,120 L130,120 L125,200 L75,200 Z" fill="#aaaaaa" />
  
  <!-- Jersey Number Placeholder -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
  
  <!-- Face Features -->
  <g fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round">
    <!-- Eyes -->
    <circle cx="85" cy="65" r="5" />
    <circle cx="115" cy="65" r="5" />
    
    <!-- Smile -->
    <path d="M80,85 Q100,100 120,85" />
  </g>
  
  <!-- Jersey Pattern -->
  <g stroke="#999999" stroke-width="1" opacity="0.5">
    <line x1="75" y1="130" x2="125" y2="130" />
    <line x1="75" y1="140" x2="125" y2="140" />
    <line x1="75" y1="150" x2="125" y2="150" />
    <line x1="76" y1="160" x2="124" y2="160" />
    <line x1="77" y1="170" x2="123" y2="170" />
    <line x1="78" y1="180" x2="122" y2="180" />
    <line x1="79" y1="190" x2="121" y2="190" />
  </g>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="200" rx="50" ry="10" fill="#000000" opacity="0.1" />
</svg>
